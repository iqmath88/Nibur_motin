<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nibor Motion — محرك المخروط السينمائي</title><style>
:root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif;background:#071422;color:#eaf6ff}*{box-sizing:border-box}body{margin:0;padding:16px;display:flex;align-items:center;flex-direction:column;gap:12px}header,.controls,.status{width:min(100%,900px)}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:20px;margin:0 0 6px}.muted{font-size:12px;color:#aac8d9;line-height:1.7}.view{width:min(100%,420px);aspect-ratio:9/16;background:#0c2032;border-radius:16px;border:1px solid #276176;overflow:hidden;box-shadow:0 20px 50px #0008}canvas{width:100%;height:100%;display:block}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button{border:1px solid #397788;background:#12394d;border-radius:10px;padding:10px 13px;color:#fff;font-size:14px;font-weight:bold;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input[type=range]{flex:1;min-width:160px;accent-color:#4ad3db}.status{font-size:12px;color:#b4cfdd;line-height:1.8}strong{color:#e8d59a}a{color:#a2e5f4} .numbers{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}@media(max-width:550px){header{flex-direction:column;align-items:start}.controls button{padding:9px}}
</style></head><body>
<header><div><h1>Nibor Motion — محرك المخروط</h1><div class="muted">نموذج قابل للتشغيل · المعادلات والحركة مرسومة على Canvas نفسه</div></div><div class="muted">1080 × 1920 · 30fps · 9:16</div></header>
<div class="view"><canvas id="film" width="1080" height="1920" aria-label="مشهد متحرك لمخروط ماء ومعادلات المعدلات المرتبطة بالزمن"></canvas></div>
<div class="controls"><button id="play">▶ تشغيل</button><button id="reset">↺ إعادة</button><input id="seek" type="range" min="0" max="60" step=".033333" value="0" aria-label="توقيت الفيديو"><span class="numbers" id="clock">00:00 / 01:00</span><button id="export">⤓ تصدير WebM</button></div>
<div class="status" id="status">التصدير عبر MediaRecorder متاح فقط في المتصفحات التي تدعمه. لا يحتوي النموذج على تعليق صوتي. القيم الرياضية مثال اختباري، وليست استخراجاً حرفياً من الملزمة.</div>
<script>
(()=>{'use strict';
const cv=document.getElementById('film'),ctx=cv.getContext('2d',{alpha:false});const play=document.getElementById('play'),reset=document.getElementById('reset'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),exportBtn=document.getElementById('export'),status=document.getElementById('status');const W=1080,H=1920,L=24,R=8,FPS=30,D=60,dVdt=4,pi=Math.PI,V0=pi/27*Math.pow(9.5,3),V12=pi/27*Math.pow(12,3),tRef=(V12-V0)/dVdt;let t=0,playing=false,last=0,exporting=false;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const ease=x=>{x=clamp(x);return x*x*(3-2*x)};const alpha=(start,end)=>ease((t-start)/(end-start));const rgb=(s,a)=>{ctx.globalAlpha=clamp(a);ctx.fillStyle=s};
function txt(s,x,y,size,color='#eaf6ff',align='center',weight='600',direction='rtl'){ctx.save();ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${direction==='ltr'?"Georgia,'Times New Roman',serif":"Tahoma,Arial,sans-serif"}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.direction=direction;ctx.fillText(s,x,y);ctx.restore()}
function pathLine(x1,y1,x2,y2,color,width=3){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function ellipse(x,y,rx,ry,color,stroke=null){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(color){ctx.fillStyle=color;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.stroke()}}
function fadeBlock(start,end,draw){ctx.save();ctx.globalAlpha=alpha(start,end);draw();ctx.restore()}
// Math layout tree: all mathematical typesetting is rendered on the SAME canvas as the 3D diagram and exported video.
const T=s=>({kind:'t',s:String(s)}),I=s=>({kind:'i',s:String(s)}),Row=(...items)=>({kind:'row',items}),Frac=(a,b)=>({kind:'frac',a,b}),Sup=(a,b)=>({kind:'sup',a,b});
function measure(n,z){if(n.kind==='t'||n.kind==='i'){ctx.save();ctx.font=`${n.kind==='i'?'italic ':''}${z}px Georgia,'Times New Roman',serif`;const w=ctx.measureText(n.s).width;ctx.restore();return {w,up:z*.82,down:z*.25}}if(n.kind==='row'){const v=n.items.map(x=>measure(x,z));return {w:v.reduce((s,x)=>s+x.w,0),up:Math.max(...v.map(x=>x.up),0),down:Math.max(...v.map(x=>x.down),0)}}if(n.kind==='frac'){const a=measure(n.a,z*.78),b=measure(n.b,z*.78);return {w:Math.max(a.w,b.w)+24,up:a.up+a.down+13,down:b.up+b.down+13}}if(n.kind==='sup'){const a=measure(n.a,z),b=measure(n.b,z*.59);return {w:a.w+b.w+2,up:Math.max(a.up,b.up+b.down+a.up*.42),down:a.down}}return {w:0,up:0,down:0}}
function drawMath(n,x,y,z,color='#f8fbff'){ctx.save();ctx.fillStyle=color;ctx.strokeStyle=color;if(n.kind==='t'||n.kind==='i'){ctx.font=`${n.kind==='i'?'italic ':''}${z}px Georgia,'Times New Roman',serif`;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.direction='ltr';ctx.fillText(n.s,x,y)}else if(n.kind==='row'){for(const part of n.items){drawMath(part,x,y,z,color);x+=measure(part,z).w}}else if(n.kind==='frac'){const m=measure(n,z),a=measure(n.a,z*.78),b=measure(n.b,z*.78),mid=x+m.w/2;drawMath(n.a,mid-a.w/2,y-15-a.down,z*.78,color);drawMath(n.b,mid-b.w/2,y+16+b.up,z*.78,color);pathLine(x+6,y,x+m.w-6,y,color,2.8)}else if(n.kind==='sup'){const a=measure(n.a,z);drawMath(n.a,x,y,z,color);drawMath(n.b,x+a.w+2,y-a.up*.53,z*.59,color)}ctx.restore()}
function equation(n,y,z=46,color='#fff'){const w=measure(n,z).w;let scale=1;if(w>876)scale=876/w;ctx.save();ctx.translate(W/2,y);ctx.scale(scale,scale);drawMath(n,-w/2,0,z,color);ctx.restore()}
const x2=Sup(I('x'),T('2')),y2=Sup(I('y'),T('2')),h2=Sup(I('h'),T('2')),h3=Sup(I('h'),T('3'));const dvdt=Frac(Row(I('d'),I('V')),Row(I('d'),I('t'))),dhdt=Frac(Row(I('d'),I('h')),Row(I('d'),I('t')));
const scenes=[
{title:'ما معدل ارتفاع الماء؟',hint:'مخروط ارتفاعه 24 سم ونصف قطره 8 سم',eq:Row(T('dV/dt = 4 cm³/s'))},
{title:'تشابه المثلثات',hint:'نسبة نصف القطر إلى الارتفاع ثابتة',eq:Row(Frac(I('r'),I('h')),T(' = '),Frac(T('8'),T('24')),T(' = '),Frac(T('1'),T('3')))},
{title:'قانون الحجم',hint:'نعوّض نصف القطر من علاقة التشابه',eq:Row(I('V'),T(' = '),Frac(T('π'),T('3')),Sup(I('r'),T('2')),I('h'),T(' = '),Frac(T('π'),T('27')),h3)},
{title:'نشتق بالنسبة للزمن',hint:'المشتقة تُظهر العلاقة بين معدلَي التغيّر',eq:Row(dvdt,T(' = '),Frac(T('π'),T('9')),h2,dhdt)},
{title:'عند ارتفاع الماء 12 سم',hint:'معدل زيادة الحجم 4 سم³/ثا',eq:Row(T('4 = '),Frac(T('π'),T('9')),T(' × '),Sup(T('(12)'),T('2')),T(' × '),dhdt)},
{title:'معدل ارتفاع سطح الماء',hint:'النتيجة موجبة لأن الماء يرتفع',eq:Row(dhdt,T(' = '),Frac(T('1'),T('4π')),T(' ≈ 0.0796 cm/s'))}
];
const bounds=[0,9,20,31,42,51,60];
function sceneIndex(){for(let i=0;i<6;i++)if(t<bounds[i+1])return i;return 5}
function background(){let gr=ctx.createLinearGradient(0,0,1080,1920);gr.addColorStop(0,'#06131f');gr.addColorStop(.55,'#092738');gr.addColorStop(1,'#050f1a');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);let rad=ctx.createRadialGradient(600,810,100,580,770,700);rad.addColorStop(0,'rgba(24,183,195,.16)');rad.addColorStop(1,'rgba(24,183,195,0)');ctx.fillStyle=rad;ctx.fillRect(0,0,W,H);for(let x=70;x<1080;x+=85){pathLine(x,280,x,1410,'rgba(66,179,190,.065)',1)}for(let y=300;y<1450;y+=85)pathLine(50,y,1030,y,'rgba(66,179,190,.065)',1)}
function cone(){const h=Math.cbrt((V0+dVdt*t)*27/pi),r=h/3;const apex={x:540,y:1230},rim={x:540,y:500},RX=300,RY=58;const hy=apex.y-(h/L)*(apex.y-rim.y),hrx=RX*(r/R),hry=RY*(r/R);
ctx.save();ctx.shadowColor='rgba(0,226,242,.2)';ctx.shadowBlur=35;pathLine(apex.x,apex.y,rim.x-RX,rim.y,'#72b9ca',5);pathLine(apex.x,apex.y,rim.x+RX,rim.y,'#72b9ca',5);ctx.restore();
// Water volume inside cone bounded by sloping walls, with upper ellipse defining the physical fill level.
const water=ctx.createLinearGradient(0,hy,0,apex.y);water.addColorStop(0,'rgba(70,215,242,.76)');water.addColorStop(.4,'rgba(13,139,203,.65)');water.addColorStop(1,'rgba(20,62,139,.7)');ctx.beginPath();ctx.moveTo(540-hrx,hy);ctx.lineTo(apex.x,apex.y);ctx.lineTo(540+hrx,hy);ctx.closePath();ctx.fillStyle=water;ctx.fill();
ellipse(540,hy,hrx,hry,'rgba(93,234,248,.51)','#b5faff');ellipse(540,rim.y,RX,RY,'rgba(13,45,66,.28)','#7abdd0');
ctx.save();ctx.setLineDash([9,12]);pathLine(540,rim.y,540,apex.y,'rgba(236,245,255,.3)',2);ctx.restore();
// Labels and measurement leaders.
pathLine(880,rim.y,880,apex.y,'#86abb9',2);pathLine(864,rim.y,897,rim.y,'#86abb9',2);pathLine(864,apex.y,897,apex.y,'#86abb9',2);txt('24 cm',925,850,31,'#d4e6ed','left','500','ltr');
pathLine(540,rim.y-90,840,rim.y-90,'#8fcad2',3);txt('8 cm',685,rim.y-124,32,'#d8f5f1','center','600','ltr');
pathLine(540-hrx-52,hy,540-hrx-52,apex.y,'#ffd181',3);txt('h',540-hrx-85,(hy+apex.y)/2,46,'#ffdb8a','center','700','ltr');
txt('الماء',540,Math.min(1190,hy+85),36,'#f4fcff');
// Live measurements synchronized to actual V(t), not visually linearized water height.
rounded(160,1302,760,100,24,'rgba(8,43,60,.94)','#326f83');txt('ارتفاع الماء المتغير',765,1338,30,'#a1dbe5','right');txt(`h = ${h.toFixed(2)} cm`,310,1364,38,'#fff','center','700','ltr');

}
function frame(){background();rounded(70,65,940,83,24,'rgba(13,50,67,.94)','#236c7b');txt('NIBOR / MOTION',920,106,29,'#6fe5ee','right','700','ltr');txt('رياضيات السادس العلمي',140,106,28,'#b9d3dc','left');txt('المعدلات المرتبطة بالزمن',540,238,60,'#fff');txt('المخروط وارتفاع الماء',540,311,40,'#8ad9e4');
cone();const i=sceneIndex(),s=scenes[i],from=bounds[i];const opacity=alpha(from,from+1.0);rounded(94,1450,892,340,32,'rgba(12,43,60,.96)','#2d7085');ctx.save();ctx.globalAlpha=opacity;txt(s.title,540,1520,42,'#ffdc91');equation(s.eq,1648,54);txt(s.hint,540,1730,28,'#b5dce7');ctx.restore();rounded(94,1824,892,8,4,'#1c5366');rounded(94,1824,892*clamp(t/D),8,4,'#58d9e6');txt('محاكاة رياضية — دون صوت',540,1885,23,'#729cac');}
function update(){seek.value=t;clock.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')} / 01:00`;play.textContent=playing?'Ⅱ إيقاف':'▶ تشغيل';frame()}
function loop(now){if(playing&&!exporting){if(last)t=Math.min(D,t+(now-last)/1000);if(t===D)playing=false;update()}last=now;requestAnimationFrame(loop)}
play.addEventListener('click',()=>{if(exporting)return;if(t>=D)t=0;playing=!playing;last=0;update()});reset.addEventListener('click',()=>{if(exporting)return;playing=false;t=0;last=0;update()});seek.addEventListener('input',()=>{if(exporting)return;playing=false;t=Number(seek.value);update()});
const supported=typeof cv.captureStream==='function'&&typeof window.MediaRecorder==='function';if(!supported){exportBtn.disabled=true;status.textContent='التصدير WebM غير مدعوم في هذا المتصفح. يظل العرض التفاعلي متاحاً.'}
exportBtn.addEventListener('click',async()=>{if(!supported||exporting)return;playing=false;exporting=true;exportBtn.disabled=true;play.disabled=reset.disabled=seek.disabled=true;const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];const mime=types.find(x=>MediaRecorder.isTypeSupported(x));if(!mime){status.textContent='المتصفح لا يدعم WebM عبر MediaRecorder';exporting=false;exportBtn.disabled=false;play.disabled=reset.disabled=seek.disabled=false;return}const chunks=[];let rec;try{const stream=cv.captureStream(FPS);rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:9000000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onerror=()=>{status.textContent='حدث خطأ أثناء التصدير'};rec.onstop=()=>{if(chunks.length){const url=URL.createObjectURL(new Blob(chunks,{type:mime})),a=document.createElement('a');a.href=url;a.download='Nibor-Cone-Cinematic.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);status.textContent='تم إعداد ملف WebM. افحصه قبل استخدامه.'}stream.getTracks().forEach(x=>x.stop());exporting=false;exportBtn.disabled=false;play.disabled=reset.disabled=seek.disabled=false};t=0;update();rec.start(1000);status.textContent='جارٍ تسجيل فيديو WebM مدة 60 ثانية في الزمن الحقيقي. أبقِ الصفحة ظاهرة.';const start=performance.now();function step(now){if(!exporting||rec.state!=='recording')return;t=Math.min(D,(now-start)/1000);update();if(t<D)requestAnimationFrame(step);else rec.stop()}requestAnimationFrame(step)}catch(e){status.textContent='تعذر بدء التصدير: '+e.message;exporting=false;exportBtn.disabled=false;play.disabled=reset.disabled=seek.disabled=false}});
update();requestAnimationFrame(loop);window.NiborCone={get time(){return t},get height(){return Math.cbrt((V0+4*t)*27/pi)},referenceTime:tRef,drawAt(s){playing=false;t=clamp(Number(s),0,D);update()}};
})();</script></body></html>
